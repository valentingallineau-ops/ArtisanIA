:root[data-theme="dark"]{

.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}

const caps={sample:null,dictation:null,downloads:null};
function browserDictation(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null,on=false;const H={final:[],partial:[],state:[]};const emit=(k,v)=>H[k].forEach(f=>f(v));
  return{active:()=>on,onFinal:f=>H.final.push(f),onPartial:f=>H.partial.push(f),onState:f=>H.state.push(f),
    start(){return new Promise((res,rej)=>{try{rec=new SR();rec.lang='fr-FR';rec.interimResults=true;rec.continuous=true;
      rec.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else part+=t}
        if(fin)emit('final',{text:(/\s$/.test(fin)?fin:fin+' ')});emit('partial',{text:part})};
      rec.onstart=()=>{on=true;emit('state',{state:'listening'});res()};
      rec.onerror=e=>{on=false;emit('state',{state:'idle',reason:e.error});if(e.error==='not-allowed'||e.error==='service-not-allowed')rej({code:'not_granted'})};
      rec.onend=()=>{on=false;emit('state',{state:'idle',reason:'stopped'})};rec.start();emit('state',{state:'starting'})}catch(err){rej({code:'unavailable'})}})},
    async stop(){if(rec)rec.stop()}}}
async function initCaps(){
  if(STANDALONE){caps.dictation=browserDictation();hookDictation();syncCapsUI();return}
  if(!window.claude||!window.claude.use)return;
  await Promise.all(Object.keys(caps).map(async k=>{try{caps[k]=await window.claude.use(k)}catch(_){caps[k]=null}}));
  hookDictation();

}
function hookDictation(){
  if(caps.dictation){
    caps.dictation.onFinal(e=>{const ta=$('#desc');if(!ta)return;ta.value=(ta.value?ta.value+e.text:e.text.trimStart());ta.dispatchEvent(new Event('input'))});
    caps.dictation.onPartial(e=>{const p=$('#partial');if(p)p.textContent=e.text||''});
    caps.dictation.onState(e=>{const b=$('#mic');if(b){b.setAttribute('aria-pressed',e.state==='listening'||e.state==='starting'?'true':'false');b.textContent=(e.state==='listening')?'Écoute en cours, arrêter':(e.state==='starting'?'Démarrage…':'Dicter')}if(e.state==='idle'){const p=$('#partial');if(p)p.textContent=''}});

}

const NUMW={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10};
function ruleBased(text){
  const t=text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const has=(...r)=>r.some(x=>x.test(t));
  const numOf=s=>{if(/^\d/.test(s))return parseFloat(s.replace(',','.'));return NUMW[s]||0};
  let surf=0,surfNote='';

  if(sm)surf=parseFloat(sm[1].replace(',','.'));
  else{const dm=t.match(/(\d+(?:[.,]\d+)?)\s*m?\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*m/);if(dm){surf=r2(parseFloat(dm[1].replace(',','.'))*parseFloat(dm[2].replace(',','.')));surfNote='Surface au sol calculée ('+dm[1]+' x '+dm[2]+' m) : à convertir en surface de toiture avec la pente.'}}
  const lines=[],asked=[];
  const add=(id,qte,note)=>{if(lines.some(l=>l.prix_id===id))return;lines.push({prix_id:id,qte:qte||0,note:note||''})};
  const mlNear=(w)=>{let m=t.match(new RegExp('(\\d+(?:[.,]\\d+)?)\\s*(?:ml|m)\\s*(?:de\\s+)?'+w));if(!m)m=t.match(new RegExp(w+'[^0-9]{0,14}(\\d+(?:[.,]\\d+)?)\\s*(?:ml|m)\\b'));return m?parseFloat(m[1].replace(',','.')):0};
  const full=has(/refection|remplacement de la (?:couverture|toiture)|toiture complete|renovation (?:complete )?de (?:la |sa )?toiture|nouvelle toiture|chang(?:er|ement de) (?:la |sa )?(?:toiture|couverture)/)||(has(/refai|refaire/)&&has(/toiture|couverture/));
  const mat=has(/ardoise/)?'ard':has(/tuiles? canal|canal/)?'canal':has(/bac acier|bac-acier/)?'bac':'meca';
  const depose=full||has(/depos/);
  if(depose&&!has(/construction neuve|neuf\b/))add(has(/ardoise/)&&!/tuile/.test(t)?'dep_ard':'dep_tuile',surf,'');
  if(full){add('echaf',1,'À confirmer selon hauteur et accès');add('benne',1,'');add('ecran',surf,'');add('liteaux',surf,'');}
  if(full||has(/tuile|ardoise|bac acier|couverture/)&&surf&&!has(/fuite|cassee/))add(mat,surf,'');
  if(has(/bac acier|bac-acier/)&&!full&&surf){add('bac',surf,'')}
  if(has(/faitage/))add('faitage',mlNear('faitage'),'');

  if(vm)add('fen_toit',numOf(vm[1]),'');else if(has(/velux|fenetre de toit|chassis de toit/))add('fen_toit',1,'Nombre à confirmer');
  if(has(/gouttiere/))add(has(/zinc/)?'gout_zinc':'gout_pvc',mlNear('gouttieres?'),'');
  if(has(/fermette/))add('fermette',surf,surfNote);else if(has(/charpente/)&&has(/traitement/))add('trait_char',surf,'');else if(has(/charpente/))add('char_trad',surf,surfNote);
  if(has(/demouss|hydrofuge|nettoyage (?:de la )?toiture/))add('demouss',surf,'');
  if(has(/isolation|isoler/))add('isol',surf,'');
  if(has(/fuite|infiltration/))add('repar',1,'');
  const tm=t.match(/(\d+|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix)\s+(?:tuiles?)\s+(?:cassees?|a remplacer)/)||t.match(/(dizaine)\s+de tuiles/);
  if(tm)add('tuile_u',tm[1]==='dizaine'?10:numOf(tm[1]),'');
  else if(has(/tuiles? cassees?/))add('tuile_u',0,'Nombre de tuiles à confirmer');
  if(lines.length&&!lines.some(l=>l.prix_id==='depl'))add('depl',1,'');
  // client
  let nom='';const m1=text.match(/\b(?:M\.|Mme|Mr|Monsieur|Madame|Mlle|chez)\s+([A-ZÀ-Ý][\p{L}'-]+(?:\s+[A-ZÀ-Ý][\p{L}'-]+)?)/u);
  if(m1)nom=m1[1];else{const m2=text.match(/^\s*([A-ZÀ-Ý][\p{L}'-]+)\s*[,:]/u);if(m2)nom=m2[1]}
  const am=text.match(/(\d{1,3}\s*(?:bis|ter)?,?\s+(?:rue|avenue|av\.|chemin|route|impasse|allee|allée|boulevard|place|lotissement|quartier)\s+[^.;\n]+)/i);
  const mo=t.match(/\b(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)\b/);
  const MONTH={janvier:'janvier',fevrier:'février',mars:'mars',avril:'avril',mai:'mai',juin:'juin',juillet:'juillet',aout:'août',septembre:'septembre',octobre:'octobre',novembre:'novembre',decembre:'décembre'};
  const old=has(/construction neuve|\bneuf\b|extension/)?false:true;
  const manq=[];
  if(!surf)manq.push('Surface de toiture à mesurer (m²)');
  if(!nom)manq.push('Nom du client');
  if(!am)manq.push('Adresse du chantier');
  manq.push('Âge du logement (achevé depuis plus de 2 ans ? détermine la TVA)','Pente, hauteur et accès (échafaudage, benne, camion)','État de la charpente à vérifier sur place');
  return{client:{nom:nom,adresse:am?am[1].trim():'',tel:'',email:''},
   chantier:{titre:full?'Réfection complète de la toiture':has(/fuite/)?'Réparation de toiture':has(/charpente/)?'Travaux de charpente':'Travaux de couverture'},
   tva:{taux:20,raison:'Taux normal par prudence. Passez à 10 % seulement si le logement a plus de 2 ans (attestation du client sur le devis).'},
   delai:{debut:mo?MONTH[mo[1]]:'',duree:''},lignes:lines,
   prep:prepFallback(full,mat,surf,has(/fuite/)),manquants:manq,_old:old}}
function prepFallback(full,mat,surf,fuite){
  const s=surf>0,mats=[],out=['Harnais, ligne de vie et garde-corps','Échelle ou échafaudage conforme','Visseuse, cloueur, meuleuse','Niveau, mètre, cordeau','Bâches de protection'];
  if(full||mat){const nm={meca:'tuiles mécaniques',canal:'tuiles canal',ard:'ardoises',bac:'plaques de bac acier'}[mat]||'matériaux de couverture';
    if(s&&mat==='meca')mats.push('Tuiles mécaniques : environ '+Math.round(surf*1.1*12)+' (12/m² avec 10 % de chutes, à ajuster au modèle)');else mats.push('Couverture : '+nm+(s?' pour environ '+nf(surf*1.1,0)+' m² avec chutes':''));

    mats.push('Fixations, closoirs, faîtière et accessoires de ventilation')}
  if(fuite){mats.length=0;mats.push('Tuiles de remplacement, mortier ou colle de fixation')}
  return{materiaux:mats,outillage:out,
   etapes:full?['Installer l\'échafaudage et les protections','Déposer l\'ancienne couverture et trier','Contrôler la charpente, remplacer les pièces abîmées','Poser l\'écran de sous-toiture et les liteaux','Poser la couverture, le faîtage et les rives','Raccorder les ouvertures et la zinguerie','Nettoyer, évacuer les gravats, réceptionner']:fuite?['Repérer l\'origine de la fuite','Remplacer les tuiles cassées','Contrôler l\'étanchéité, nettoyer']:['Visite et métrés sur place','Préparer le chantier et la sécurité','Réaliser les travaux','Nettoyer et réceptionner'],
   points:['Portance et état de la charpente','Présence possible d\'amiante (fibrociment) : diagnostic avant dépose','Autorisation d\'urbanisme si l\'aspect de la toiture change (déclaration préalable en mairie)','Accès camion, emplacement benne, voisinage','Prévisions météo et plan de repli']}}

/* ============ draft generation: AI ============ */
const PROMPT_HEAD=`Tu es l'assistant de chiffrage d'un artisan français couvreur-charpentier. Tu prépares un BROUILLON de devis à partir de sa description de chantier. L'artisan relira et corrigera tout avant envoi.

RÈGLES
- Utilise en priorité les prestations de la BIBLIOTHÈQUE DE PRIX en recopiant leur identifiant dans "prix_id". N'invente jamais un prix quand une prestation de la bibliothèque convient.
- Si une prestation nécessaire n'existe pas dans la bibliothèque, ajoute-la avec "prix_id": "" et un "pu" estimé en euros HT (marché français 2026) ; le prix sera signalé "à vérifier".
- N'invente jamais une quantité. N'utilise que les chiffres donnés (surfaces, longueurs, nombres). Si tu calcules (ex. 6 m x 5 m), explique le calcul dans "note". Si la quantité est inconnue, mets "qte": 0 et ajoute la question à "prep.manquants".
- Unités : m² (de toiture), ml, u, forfait, h.
- Ajoute seulement ce qui est dans la description ou nécessairement lié (ex. échafaudage et benne pour une réfection complète) et signale-le dans "note" ("à confirmer").
- TVA : 10 si rénovation d'un logement achevé depuis plus de 2 ans ; 5.5 si amélioration de la performance énergétique d'un logement (isolation...) ; 20 dans les autres cas (construction neuve, extension de plus de 10 % de surface, local professionnel) ou si l'information est inconnue. Explique en une phrase dans "raison". Si l'âge du logement manque, mets 20 et ajoute la question à "manquants".
- "prep" est la fiche de préparation du chantier : "materiaux" (avec quantités estimées quand c'est possible), "outillage", "etapes" (dans l'ordre), "points" à vérifier (sécurité, état de la charpente, amiante pour le fibrociment, accès et levage, déclaration préalable en mairie si l'aspect change, météo), "manquants" (questions à poser au client).
- Écris en français, de façon concise. Les chaînes vides sont autorisées quand l'information est inconnue.

Réponds uniquement par un objet JSON de cette forme :
{"client":{"nom":"","adresse":"","tel":"","email":""},"chantier":{"titre":""},"tva":{"taux":20,"raison":""},"delai":{"debut":"","duree":""},"lignes":[{"prix_id":"","cat":"","designation":"","qte":0,"unite":"","pu":0,"note":""}],"prep":{"materiaux":[],"outillage":[],"etapes":[],"points":[],"manquants":[]}}`;
async function runAI(text,ctl,onProgress){
  const lib=S.prices.map(p=>p.id+' | '+p.cat+' | '+p.label+' | '+p.unit+' | '+p.pu+' EUR HT').join('\n');
  const prompt=PROMPT_HEAD+'\n\nBIBLIOTHÈQUE DE PRIX (id | catégorie | désignation | unité | prix)\n'+lib+'\n\nDESCRIPTION DU CHANTIER\n"""\n'+text.slice(0,6000)+'\n"""';
  return await caps.sample.json(prompt,{signal:ctl.signal,onText:u=>onProgress(u.text.length)});
}
const strArr=a=>Array.isArray(a)?a.map(x=>String(x==null?'':x).trim()).filter(Boolean).slice(0,40):[];
const str=v=>String(v==null?'':v).trim();
function quoteFromDraft(d,text,source){
  const q=newQuote();d=d||{};
  q.source=source;q.texte=text;
  const cl=d.client||{};q.client={nom:str(cl.nom),adresse:str(cl.adresse),tel:str(cl.tel),email:str(cl.email)};
  q.chantier={titre:str(d.chantier&&d.chantier.titre)};
  if(!q.client.adresse&&d.chantier&&d.chantier.adresse)q.client.adresse=str(d.chantier.adresse);
  let taux=Number(d.tva&&d.tva.taux);if(![20,10,5.5].includes(taux))taux=20;
  q.tva={taux,raison:str(d.tva&&d.tva.raison)};
  q.debut=str(d.delai&&d.delai.debut);q.duree=str(d.delai&&d.delai.duree);
  q.lignes=(Array.isArray(d.lignes)?d.lignes:[]).slice(0,60).map(l=>{
    const p=S.prices.find(x=>x.id===str(l.prix_id));
    const qte=Math.max(0,Number(l.qte)||0);
    return{id:uid(),cat:p?p.cat:(CATS.includes(str(l.cat))?str(l.cat):'Divers'),designation:str(l.designation)||(p?p.label:'Prestation'),qte,unite:str(l.unite)||(p?p.unit:'u'),
      pu:p?p.pu:Math.max(0,Number(l.pu)||0),prixId:p?p.id:'',indicatif:p?!p.verified:true,note:str(l.note)}});
  const pr=d.prep||{};
  q.prep={materiaux:strArr(pr.materiaux),outillage:strArr(pr.outillage),etapes:strArr(pr.etapes),points:strArr(pr.points),manquants:strArr(pr.manquants||d.manquants)};
  return q}

/* ============ interactions ============ */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},3800)}
function openModal(html){const m=$('#modal');m.innerHTML='<div class="scrim" data-act="close-modal"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';const f=$('.sheet textarea,.sheet button',m);if(f)f.focus()}
function closeModal(){$('#modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function copyText(text,label){
  try{await navigator.clipboard.writeText(text);toast((label||'Texte')+' copié.')}
  catch(_){openModal('<h3>Copier le texte</h3><p class="small muted" style="margin:6px 0 10px">Sélectionnez le texte puis copiez-le.</p><textarea id="cpy" rows="10" readonly>'+esc(text)+'</textarea><div class="row" style="margin-top:10px"><button class="btn" type="button" data-act="close-modal">Fermer</button></div>');const t=$('#cpy');if(t){t.focus();t.select()}}}
function printDoc(q){
  const f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(_){toast('Impression impossible ici. Utilisez Télécharger le devis.')}setTimeout(()=>f.remove(),4000)};f.srcdoc=standalone(q)}
async function saveFile(name,data){
  if(!caps.downloads&&STANDALONE){
    try{const type=/\.json$/.test(name)?'application/json':'text/html';const url=URL.createObjectURL(new Blob([data],{type:type+';charset=utf-8'}));
      const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Fichier enregistré.')}
    catch(_){toast('Téléchargement impossible.')}return}
  if(!caps.downloads){toast('Téléchargement indisponible dans cet affichage. Utilisez « Copier le texte ».');return}
  try{await caps.downloads.save({filename:name,data});toast('Fichier enregistré.')}
  catch(e){if(!e||e.code!=='declined')toast('Téléchargement impossible ('+(e&&e.code||'erreur')+').')}}
function relanceModal(q){
  const t=totals(q),c=S.company,sent=fdate(q.sentAt||q.date),nom=q.client.nom.replace(/\s*\(exemple\)/,'')||'Madame, Monsieur',till=fdate(addDays(q.date,Number(q.validite)||30));
  const v1='Bonjour '+nom+',\n\nJe me permets de revenir vers vous au sujet du devis '+q.num+' ('+(q.chantier.titre||'travaux')+', '+eur(t.ttc)+' TTC) que je vous ai envoyé le '+sent+'.\nAvez-vous pu le consulter ? Je reste disponible pour répondre à vos questions ou ajuster la proposition.\n\nCordialement,\n'+(c.nom||'');
  const v2='Bonjour '+nom+',\n\nVotre devis '+q.num+' reste valable jusqu\'au '+till+'. Si le projet est toujours d\'actualité, je peux réserver une date de chantier dès votre accord. Souhaitez-vous que nous en parlions ?\n\nCordialement,\n'+(c.nom||'');
  openModal('<h3>Relancer '+esc(nom)+'</h3><p class="small muted" style="margin:4px 0 10px">Deux formulations. Copiez, collez dans votre SMS ou votre e-mail.</p>'
   +'<label class="lbl" for="rl1">Courtoise</label><textarea id="rl1" rows="6" readonly>'+esc(plain(v1))+'</textarea><div class="row" style="margin:8px 0 14px"><button class="btn sm blue" type="button" data-act="copy-ta" data-t="rl1">Copier</button></div>'
   +'<label class="lbl" for="rl2">Avec la date limite</label><textarea id="rl2" rows="5" readonly>'+esc(plain(v2))+'</textarea><div class="row" style="margin:8px 0 14px"><button class="btn sm blue" type="button" data-act="copy-ta" data-t="rl2">Copier</button></div>'
   +'<div class="row"><button class="btn primary" type="button" data-act="relanced" data-id="'+q.id+'">J\'ai relancé</button><button class="btn" type="button" data-act="close-modal">Fermer</button></div>')}

app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,q=curQuote();
  if(a==='example'){const ta=$('#desc');ta.value=EXAMPLES[+b.dataset.i].s;ta.focus()}
  else if(a==='gen')generate();
  else if(a==='stop'){if(gen.ctl)gen.ctl.abort()}
  else if(a==='blank'){const n=newQuote();S.quotes.unshift(n);save();ed.tab='devis';location.hash='d-'+n.id}
  else if(a==='flt'){flt=b.dataset.k;render()}
  else if(a==='rm-examples'){S.quotes=S.quotes.filter(x=>!x.exemple);save();render()}
  else if(a==='tab'){ed.tab=b.dataset.tab;render()}
  else if(a==='add-lib'){const id=$('#addlib').value;if(!id||!q)return;const p=S.prices.find(x=>x.id===id);if(!p)return;
    q.lignes.push({id:uid(),cat:p.cat,designation:p.label,qte:(p.unit==='forfait'||p.unit==='u')?1:0,unite:p.unit,pu:p.pu,prixId:p.id,indicatif:!p.verified,note:''});save();render()}
  else if(a==='add-free'&&q){q.lignes.push({id:uid(),cat:'Divers',designation:'',qte:1,unite:'u',pu:0,prixId:'',indicatif:false,note:''});save();render()}
  else if(a==='del-line'&&q){const id=b.closest('.line').dataset.id;q.lignes=q.lignes.filter(l=>l.id!==id);save();render()}
  else if(a==='dup'&&q){const n=JSON.parse(JSON.stringify(q));n.id=uid();n.num=nextNum();n.date=today();n.statut='brouillon';n.sentAt='';n.exemple=false;n.lastRelance='';n.client.nom=n.client.nom.replace(/\s*\(exemple\)/,'');n.lignes.forEach(l=>l.id=uid());S.quotes.unshift(n);save();location.hash='d-'+n.id;toast('Devis dupliqué.')}
  else if(a==='del-quote'&&q){if(delArm===q.id){S.quotes=S.quotes.filter(x=>x.id!==q.id);delArm='';save();location.hash='devis';toast('Devis supprimé.')}else{delArm=q.id;render()}}
  else if(a==='copy-prep'&&q)copyText(prepText(q),'Fiche');
  else if(a==='copy-quote'&&q)copyText(quoteText(q),'Devis');
  else if(a==='print'&&q)printDoc(q);
  else if(a==='dl'&&q)saveFile('Devis-'+q.num+'.html',standalone(q));
  else if(a==='mark-sent'&&q){q.statut='envoye';q.sentAt=today();save();render();toast('Devis marqué comme envoyé.')}
  else if(a==='relance'&&q)relanceModal(q);
  else if(a==='copy-ta'){const t=$('#'+b.dataset.t);copyText(t.value,'Message')}
  else if(a==='relanced'){const x=S.quotes.find(z=>z.id===b.dataset.id);if(x){x.lastRelance=today();save()}closeModal();render();toast('Relance enregistrée.')}
  else if(a==='close-modal'){if(e.target===b||b.tagName==='BUTTON')closeModal()}
  else if(a==='verify-all'){S.prices.forEach(p=>p.verified=true);save();render()}
  else if(a==='del-price'){S.prices=S.prices.filter(p=>p.id!==b.dataset.id);save();render()}
  else if(a==='add-price'){const label=$('#np-label').value.trim(),pu=parseFloat($('#np-pu').value);if(!label||!(pu>=0)){toast('Indiquez une désignation et un prix.');return}
    S.prices.push({id:'c_'+uid(),cat:$('#np-cat').value,label,unit:$('#np-unit').value.trim()||'u',pu,verified:true});save();render();toast('Prestation ajoutée.')}
  else if(a==='export')saveFile('ArtisanIA-sauvegarde-'+today()+'.json',JSON.stringify(S,null,1));
  else if(a==='reset'){if(delArm==='reset'){S=defaults();save();delArm='';location.hash='nouveau';render();toast('Application réinitialisée.')}else{delArm='reset';render()}}
});

function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
function onField(e){
  const el=e.target;if(!el||!el.dataset)return;
  const q=curQuote();
  if(el.dataset.q&&q){
    let v=el.value;if(el.hasAttribute('data-bool'))v=el.checked;else if(el.hasAttribute('data-num')){v=parseFloat(String(v).replace(',','.'));if(!isFinite(v))v=0}
    setPath(q,el.dataset.q,v);
    if(el.dataset.q==='statut'){if(v==='envoye'&&!q.sentAt)q.sentAt=today();if(e.type==='change')render()}
    updateTotals(q);scheduleSave();renderNav();return}
  if(el.dataset.f&&q){const le=el.closest('.line');const l=q.lignes.find(x=>x.id===le.dataset.id);if(!l)return;let v=el.value;
    if(el.dataset.f==='qte'||el.dataset.f==='pu'){v=parseFloat(String(v).replace(',','.'));if(!isFinite(v)||v<0)v=0;if(el.dataset.f==='pu')l.indicatif=false}
    l[el.dataset.f]=v;refreshLine(l);updateTotals(q);scheduleSave();return}
  if(el.dataset.prep&&q){q.prep[el.dataset.prep]=el.value.split('\n').map(s=>s.trim()).filter(Boolean);scheduleSave();return}
  if(el.dataset.co){let v=el.value;if(el.hasAttribute('data-bool'))v=el.checked;else if(el.hasAttribute('data-num')){v=parseFloat(String(v).replace(',','.'));if(!isFinite(v))v=0}
    S.company[el.dataset.co]=v;scheduleSave();
    const miss=companyMissing(),n=$('#comp-n');if(n){n.textContent=(9-miss.length)+' sur 9';$('#comp-bar').style.width=((9-miss.length)/9*100)+'%';$('#comp-miss').textContent=miss.length?'Manque : '+miss.join(', ')+'.':'Toutes les mentions courantes sont renseignées.'}
    if(e.type==='change'&&el.dataset.co==='franchiseTva')render();return}
  if(el.dataset.price){const p=S.prices.find(x=>x.id===el.dataset.price);if(!p)return;const v=parseFloat(String(el.value).replace(',','.'));if(!isFinite(v)||v<0)return;p.pu=v;p.verified=true;
    const bd=el.closest('.prow').querySelector('[data-badge]');if(bd)bd.remove();scheduleSave();return}
  if(el.id==='pfilter'){const s=el.value.toLowerCase().trim();document.querySelectorAll('#plist .prow').forEach(r=>{r.hidden=s&&!r.dataset.text.includes(s)});document.querySelectorAll('#plist [data-cat]').forEach(c=>{c.hidden=!c.querySelector('.prow:not([hidden])')})}
}
app.addEventListener('input',onField);app.addEventListener('change',onField);
app.addEventListener('change',e=>{if(e.target.id==='imp'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1||!Array.isArray(o.quotes)||!Array.isArray(o.prices))throw 0;S=o;S.company=Object.assign(defaults().company,S.company||{});save();render();toast('Sauvegarde importée.')}catch(_){toast('Fichier de sauvegarde non reconnu.')}};r.readAsText(f)}});
app.addEventListener('click',e=>{const m=e.target.closest('#mic');if(!m||!caps.dictation)return;
  if(caps.dictation.active()){caps.dictation.stop().catch(()=>{});return}
  caps.dictation.start().catch(err=>{if(err&&err.code==='not_granted'){m.hidden=true;toast('Dictée refusée : saisissez le texte au clavier.')}else if(err&&err.code!=='stopped'&&err.code!=='dismissed')toast('La dictée n\'a pas démarré.')})});

render();initCaps();
})();
</script>
