name: Brain foundation tests
on:
  push:
    branches: [feature/v3-brain-foundation]
    paths:
      - 'brain/**'
      - 'tests/**'
      - '.github/workflows/brain-tests.yml'
  pull_request:
    branches: [feature/v2-responsive-ux]
    paths:
      - 'brain/**'
      - 'tests/**'
      - '.github/workflows/brain-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run local brain tests
        run: node --test tests/*.test.js
